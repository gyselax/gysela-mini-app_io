metadata:
  fdistribu_filename_size:  size_t 
  fdistribu_filename: { type: array, subtype: char, size: "$fdistribu_filename_size" }
  Nx_spline_cells : int
  Ny_spline_cells : int
  Nvx_spline_cells : int
  Nvy_spline_cells : int
  iter : int
  iter_offset : int
  time_saved : double
  deltat: double
  absolute_time: double
  nbstep_diag: int
  iter_saved : int
  MeshX_extents: { type: array, subtype: int64, size: 1 }
  MeshX:
    type: array
    subtype: double
    size: [ '$MeshX_extents[0]' ]
  MeshY_extents: { type: array, subtype: int64, size: 1 }
  MeshY:
    type: array
    subtype: double
    size: [ '$MeshY_extents[0]' ]
  MeshVx_extents: { type: array, subtype: int64, size: 1 }
  MeshVx:
    type: array
    subtype: double
    size: [ '$MeshVx_extents[0]' ]
  MeshVy_extents: { type: array, subtype: int64, size: 1 }
  MeshVy:
    type: array
    subtype: double
    size: [ '$MeshVy_extents[0]' ]
  Nkinspecies: int
  fdistribu_charges_extents : { type: array, subtype: int64, size: 1 }
  fdistribu_charges:
    type: array
    subtype: double
    size: [ '$fdistribu_charges_extents[0]' ]
  fdistribu_masses_extents : { type: array, subtype: int64, size: 1 }
  fdistribu_masses:
    type: array
    subtype: double
    size: [ '$fdistribu_masses_extents[0]' ]
  fdistribu_eq_extents : { type: array, subtype: int64, size: 3 }
  fdistribu_eq:
    type: array
    subtype: double
    size: [ '$fdistribu_eq_extents[0]', '$fdistribu_eq_extents[1]', '$fdistribu_eq_extents[2]' ]

  #-- Parallel data
  local_fdistribu_starts: { type: array, subtype: size_t, size: 5 }
  local_fdistribu_extents: { type: array, subtype: size_t, size: 5 }

  #-- Catalyst
  cycle: int
  time: double

data:
  fdistribu:
    type: array
    subtype: double
    size: [ '$local_fdistribu_extents[0]', '$local_fdistribu_extents[1]', '$local_fdistribu_extents[2]', '$local_fdistribu_extents[3]', '$local_fdistribu_extents[4]' ]
  electrostatic_potential_extents: { type: array, subtype: int64, size: 2 }
  electrostatic_potential:
    type: array
    subtype: double
    size: [ '$electrostatic_potential_extents[0]', '$electrostatic_potential_extents[1]' ]
  bidon:
    type: array
    subtype: double
    size: [ '$local_fdistribu_extents[3]', '$local_fdistribu_extents[4]' ]
  bidon_bis:
    type: array
    subtype: double
    size: [ '$local_fdistribu_extents[3]', '$local_fdistribu_extents[4]' ]

plugins:
  mpi:
  set_value:
    on_init:
      - share:
        - iter_saved: 0
        - absolute_time: 0.0
    on_data:
      iter:
        - set:
          # Shift file number in order not to change predcorr_implementation
          - iter_saved: '(${iter} + ${iter_offset}) / ${nbstep_diag}'
          - absolute_time: '(${iter} + ${iter_offset}) * ${deltat}'
    on_finalize:
      - release: [iter_saved, absolute_time]
  decl_hdf5:
    - file: '${fdistribu_filename}'
      communicator: $MPI_COMM_WORLD
      on_event: [read_fdistribu]
      datasets:
        fdistribu:
          type: array
          subtype: double
          size: ['$Nkinspecies', '$MeshX_extents[0]', '$MeshY_extents[0]', '$MeshVx_extents[0]', '$MeshVy_extents[0]']
      read:
        fdistribu:
          dataset_selection:
            size: [ '$local_fdistribu_extents[0]', '$local_fdistribu_extents[1]', '$local_fdistribu_extents[2]', '$local_fdistribu_extents[3]', '$local_fdistribu_extents[4]' ]
            start: ['$local_fdistribu_starts[0]', '$local_fdistribu_starts[1]', '$local_fdistribu_starts[2]', '$local_fdistribu_starts[3]', '$local_fdistribu_starts[4]']
    - file: 'GYSELALIBXX_initstate.h5'
      on_event: [initial_state]
      collision_policy: replace_and_warn
      write: [Nx_spline_cells, Nvx_spline_cells, MeshX, MeshY, MeshVx, MeshVy, nbstep_diag, Nkinspecies, fdistribu_charges, fdistribu_masses, fdistribu_eq]
    - file: 'GYSELALIBXX_${iter_saved:05}.h5'
      communicator: $MPI_COMM_WORLD
      on_event: [iteration, last_iteration]
      when: '${iter} % ${nbstep_diag} = 0'
      collision_policy: replace_and_warn
      datasets:
        fdistribu:
          type: array
          subtype: double
          size: [ '$Nkinspecies', '$MeshX_extents[0]', '$MeshY_extents[0]', '$MeshVx_extents[0]', '$MeshVy_extents[0]' ]
      write:
        time_saved: $absolute_time
        fdistribu:
          dataset_selection:
            size: [ '$local_fdistribu_extents[0]', '$local_fdistribu_extents[1]', '$local_fdistribu_extents[2]', '$local_fdistribu_extents[3]', '$local_fdistribu_extents[4]' ]
            start: [ '$local_fdistribu_starts[0]', '$local_fdistribu_starts[1]', '$local_fdistribu_starts[2]', '$local_fdistribu_starts[3]', '$local_fdistribu_starts[4]' ]
        electrostatic_potential: ~
  # trace: info
  pycall:
    on_event:
      initial_catalyst:
        with: {meshx_py: $MeshX, meshy_py: $MeshY, meshvx_py: $MeshVx, meshvy_py: $MeshVy, local_fdistribu_extents_py: $local_fdistribu_extents, local_fdistribu_starts_py: $local_fdistribu_starts}
        exec: |
          
          from python_prep3 import print_mesh_info
          print_mesh_info(meshx_py, meshy_py, meshvx_py, meshvy_py, local_fdistribu_extents_py, local_fdistribu_starts_py)

      iteration:
        with: {fdistribu_py: $fdistribu, electrostatic_potential_py: $electrostatic_potential, iter_py: $iter, meshx_py: $MeshX, meshy_py: $MeshY, meshvx_py: $MeshVx, meshvy_py: $MeshVy, local_fdistribu_extents_py: $local_fdistribu_extents, local_fdistribu_starts_py: $local_fdistribu_starts}
        exec: |
          import mpi4py
          from python_prep3 import prep4catalyst
          prep4catalyst(fdistribu_py, electrostatic_potential_py, iter_py, meshx_py, meshy_py, meshvx_py, meshvy_py, local_fdistribu_extents_py, local_fdistribu_starts_py)
          

  catalyst:
    scripts:
      script1: "/Users/yushan/Codes/GitHub/gysela-mini-app/gysela-mini-app_io/apps/catalyst_pipeline_with_rendering.py"
      # script2: "/Users/yushan/Codes/GitHub/gysela-mini-app/gysela-mini-app_io/apps/catalyst_pipeline.py"
    on_event: "catalyst_execute"
    execute:
      state:
        timestep: '$cycle'
        time: '$time'
        multiblock: 1
      channels:
        grid:
          type: "mesh"
          data:
            coordsets:
              my_coords:
                type: "rectilinear"
                values:
                  x:
                    PDI_data_array: "local_points_X"
                    size: '$local_fdistribu_extents[1]'
                  y:
                    PDI_data_array: "local_points_Y"
                    size: '$local_fdistribu_extents[3]'
            topologies:
              my_mesh:
                type: "rectilinear"
                coordset: "my_coords"
            fields:
              fixed_point_fdistribu:
                association: "vertex"
                topology: "my_mesh"
                volume_dependent: "false"
                values:
                  PDI_data_array: "bidon"
                  size: '$local_fdistribu_extents[1]*$local_fdistribu_extents[3]'
              