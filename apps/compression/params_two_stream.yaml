Input:
  case: two_stream #landau_damping
  fdistribu_filename: "none"
  nb_restart: 0
  iter_offset: 0

SplineMesh:
  x_min: 0.0
  x_max: 31.41592653589793
  x_ncells: 32
  y_min: 0.0
  y_max: 31.41592653589793
  y_ncells : 32
  vx_min: -7
  vx_max: +7
  vx_ncells: 33
  vy_min: -7
  vy_max: +7
  vy_ncells: 33

SpeciesInfo:
- charge: -1.
  mass: 1
  density_eq: 1.
  temperature_eq: 1.
  mean_velocity_eq: 2.4   # stream speed v0 for two_stream (Input.case)
  perturb_amplitude: 0.05
  perturb_mode: 1

Algorithm:
  deltat: 0.1
  nbiter: 200

CompressionBenchmark:
  compression_period: 10

Output:
  nbiter_diag: 1  # diagnostics every N timesteps (must divide compression_period)
