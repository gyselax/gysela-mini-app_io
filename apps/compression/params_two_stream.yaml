Input:
  case: two_stream #landau_damping
  fdistribu_filename: "none"
  nb_restart: 0
  iter_offset: 0

SplineMesh:
  x_min: 0.0
  x_max: 31.41592653589793
  x_ncells: 64
  y_min: 0.0
  y_max: 31.41592653589793
  y_ncells : 64
  vx_min: -10
  vx_max: +10
  vx_ncells: 65
  vy_min: -10
  vy_max: +10
  vy_ncells: 65

SpeciesInfo:
- charge: -1.
  mass: 1
  density_eq: 1.
  temperature_eq: 1.
  mean_velocity_eq: 3   # stream speed v0 for two_stream (Input.case)
  perturb_amplitude: 0.05
  perturb_mode: 1

Algorithm:
  deltat: 0.1
  nbiter: 50

compression:
  compression_period: 10
  method: "NN" # default choice "NN" or "POD"
  POD:
    n_components: 32
    normalisation: "none"
    clip_nonnegative: false
  NN:
    arch: "periodic_siren_small_32"
    lr: 1.0e-3 # for offline compression, a lr decay is applied only when is_warm is true; the lr is kept constant for the cold-start phase
    max_iters: 2000
    batch_size: 50000
    # Optimizer for the polish phase that runs after ADAM
    polish_optimizer: "lbfgs"
    lbfgs_iters: 50
    lbfgs_chunk_size: 200000  # points per jax.lax.scan step in the L-BFGS phase (bounds peak GPU memory, independent of grid resolution)
    gn_iters: 50
    gn_n_map: 16000       # Gauss-Newton mini-batch size per iteration (used only if polish_optimizer == "gauss_newton") -- needs to stay >> n_params (~2369 for periodic_siren_small_32) for a well-posed batch
    gn_init_damping: 1.0e-2
    gn_chunk_size: 2000  # points per jax.lax.scan step for the Gauss-Newton Jacobian (bounds peak GPU memory independent of gn_n_map)

Output:
  nbiter_diag: 1  # diagnostics every N timesteps (must divide compression_period)
