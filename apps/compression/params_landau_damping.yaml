Input:
  case: landau_damping #landau_damping
  fdistribu_filename: "none"
  nb_restart: 0
  iter_offset: 0

SplineMesh:
  x_min: 0.0
  x_max: 12.56637061435917
  x_ncells: 16
  y_min: 0.0
  y_max: 12.56637061435917
  y_ncells : 16
  vx_min: -6.0
  vx_max: +6.0
  vx_ncells: 17
  vy_min: -6.0
  vy_max: +6.0
  vy_ncells: 17

SpeciesInfo:
- charge: -1.
  mass: 0.0005
  density_eq: 1.
  temperature_eq: 1.
  mean_velocity_eq: 0.  
  perturb_amplitude: 0.05
  perturb_mode: 1

Algorithm:
  deltat: 0.25
  nbiter: 200

compression:
  compression_period: 10
  method: "NN"  # default choice "NN" or "POD"
  POD:
    n_components: 32
    normalisation: "none"
    clip_nonnegative: false
  NN:
    arch: "periodic_siren_deep_128"
    lr: 1.0e-3
    max_iters: 2000
    batch_size: 2000
    lbfgs_iters: 50
    lbfgs_chunk_size: 200000  # points per jax.lax.scan step in the L-BFGS phase (bounds peak GPU memory, independent of grid resolution)

Output:
  nbiter_diag: 1  # diagnostics every N timesteps (must divide compression_period)
