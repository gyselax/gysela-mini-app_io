---
name: Python checks

on:
  pull_request:
    paths:
      - '.github/workflows/python-checks.yaml'
      - '**.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependency-check:
    name: Python dependency check using deptry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          python3 -m venv .gys_env
          python3 -m pip install -e .[dev]
      - name: Check dependencies using deptry
        run: |
          deptry --optional-dependencies-dev-groups=bench,dev --package-module-name-map=PyYAML=yaml,deisa-dask=deisa processing
