[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gysela-mini-app"
version = "0.1.0"
description = "Python utilities for GYSELA mini-apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "processing",
    "deisa-dask",
    "distributed",
    "mpi4py",
    "pandas",
    "numpy",
    "h5py",
    "matplotlib",
    "PyYAML",
    "xarray[io]",
    "dask",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "deptry>=0.25.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
gysela-mini-app = "processing.utils.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
