Input:
  case: landau_damping #landau_damping
  fdistribu_filename: "none"
  nb_restart: 0
  iter_offset: 0

SplineMesh:
  x_min: 0.0
  x_max: 12.56637061435917
  x_ncells: 16
  y_min: 0.0
  y_max: 12.56637061435917
  y_ncells : 16
  vx_min: -6.0
  vx_max: +6.0
  vx_ncells: 17
  vy_min: -6.0
  vy_max: +6.0
  vy_ncells: 17

SpeciesInfo:
- charge: -1.
  mass: 0.0005
  density_eq: 1.
  temperature_eq: 1.
  mean_velocity_eq: 0.  
  perturb_amplitude: 0.05
  perturb_mode: 1

Algorithm:
  deltat: 0.25
  nbiter: 200

compression:
  compression_period: 10
  method: "NN" # default choice "NN" or "POD"
  POD:
    n_components: 32
    normalisation: "none"
    clip_nonnegative: false
  NN:
    arch: "periodic_siren_small_32"
    lr: 1.0e-3 # for offline compression, a lr decay is applied only when is_warm is true; the lr is kept constant for the cold-start phase
    max_iters: 2000       # ADAM iterations, cold-start species, and always for warm-started species when polish_optimizer == "lbfgs"
    warm_max_iters: 500   # ADAM iterations, warm-started species , only used when polish_optimizer == "gauss_newton" 
    batch_size: 50000
    polish_optimizer: "lbfgs" # or "gauss_newton"
    lbfgs_iters: 50
    lbfgs_chunk_size: 200000  # points per jax.lax.scan step in the L-BFGS phase
    gn_iters: 150 
    #for small_32 :  
    #gn_n_map: 16000       # Gauss-Newton mini-batch size per iteration 
    #gn_chunk_size: 2000  # points per jax.lax.scan step for the Gauss-Newton Jacobian (bounds peak GPU memory independent of gn_n_map)
    
    #for small_32_l5 :
    gn_n_map: 16000
    gn_chunk_size: 800

    #small_32_l8 :
    #gn_n_map: 24000
    #gn_chunk_size: 400
    
Output:
  nbiter_diag: 1  # diagnostics every N timesteps (must divide compression_period)
